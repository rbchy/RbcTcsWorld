name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Runner canary: .github/workflows/runner-canary.yml runs this whole pipeline on the NEXT runner image
  # (e.g. ubuntu-26.04) so an image change shows up there first, not on main. Normal runs use the pinned image.
  workflow_call:
    inputs:
      runner:
        description: Runner image label (empty = the pinned default)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend unit + integration tests (H2)
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Traceability matrix references only tests that exist
        run: python3 docs/qa/check_rtm.py
      - name: mvn verify
        env:
          # optional: real Stripe TEST mode for StripeSandboxIntegrationTest; without the secret it is skipped
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        run: |
          set -o pipefail
          mvn -B -f backend/pom.xml verify 2>&1 | tee build.log
      - name: Test totals
        if: always()
        run: .github/scripts/test-totals.sh backend backend/target/surefire-reports
      - name: Code coverage (JaCoCo)
        if: always()
        run: .github/scripts/coverage-summary.sh backend/target/site/jacoco/jacoco.csv
      - name: Show failed tests and build errors as annotations
        if: failure()
        run: |
          .github/scripts/annotate-failures.sh backend/target/surefire-reports
          grep -E "^\[ERROR\]" build.log | grep -v "^\[ERROR\] *$" | head -8 | sed -E 's/%/%25/g; s/^/::error title=Maven::/' || true
      - uses: actions/upload-artifact@v6
        if: always()
        with: { name: backend-test-reports, path: backend/target/surefire-reports }
      - uses: actions/upload-artifact@v6
        if: always()
        with: { name: backend-coverage, path: backend/target/site/jacoco }

  mutation-tests:
    name: Mutation testing (PIT)
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: PIT - mutate the business logic, re-run the unit tests
        run: |
          set -o pipefail
          mvn -B -f backend/pom.xml -Pmutation -Djacoco.skip=true test-compile \
              org.pitest:pitest-maven:mutationCoverage 2>&1 | tee pit.log
      - name: Mutation score and surviving mutants
        if: always()
        run: .github/scripts/mutation-summary.sh backend/target/pit-reports/mutations.xml 10
      - name: Show build errors as annotations
        if: failure()
        run: grep -E "^\[ERROR\]" pit.log | grep -v "^\[ERROR\] *$" | head -8 | sed -E 's/%/%25/g; s/^/::error title=PIT::/' || true
      - uses: actions/upload-artifact@v6
        if: always()
        with: { name: mutation-report, path: backend/target/pit-reports }

  ui-cross-browser:
    name: UI tests in ${{ matrix.browser }} (headless)
    needs: backend-tests
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false          # one browser failing must not hide the result of the other
      matrix:
        browser: [firefox, edge]   # Chrome runs in the main automation job; all three are preinstalled on the runner
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: ecommerce, POSTGRES_USER: ecommerce, POSTGRES_PASSWORD: ecommerce }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ecommerce" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build and start backend
        run: |
          mvn -B -q -f backend/pom.xml -DskipTests package
          nohup java -jar backend/target/rbctcsworld-shop-backend-1.0.0.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8081/actuator/health >/dev/null && break; sleep 2; done
          curl -sf http://localhost:8081/actuator/health
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build and serve frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npx vite preview --port 5173 --strictPort > ../frontend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5173 > /dev/null && break; sleep 1; done
      - name: Browser version
        run: |
          case "${{ matrix.browser }}" in
            firefox) v=$(firefox --version) ;;
            edge)    v=$(microsoft-edge --version) ;;
          esac
          echo "::notice title=Browser (${{ matrix.browser }})::$v"
      # One rerun for browser tests only: a test that passes on the rerun is reported as FLAKY (warning
      # annotation + count), never hidden; a test that fails twice still fails the build. API tests get no rerun.
      - name: Selenium UI journeys + accessibility in ${{ matrix.browser }}
        run: >-
          mvn -B -f automation/pom.xml test -Dgroups=ui -Dbrowser=${{ matrix.browser }}
          -Dsurefire.rerunFailingTestsCount=1
          -DbaseUrl=http://localhost:8081 -DuiUrl=http://localhost:5173 -Dheadless=true
      - name: Test totals
        if: always()
        run: .github/scripts/test-totals.sh "ui-${{ matrix.browser }}" automation/target/surefire-reports
      - name: Show failed tests as annotations
        if: failure()
        run: .github/scripts/annotate-failures.sh automation/target/surefire-reports
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ui-${{ matrix.browser }}-results
          path: |
            automation/target/surefire-reports
            automation/target/allure-results

  playwright:
    name: Playwright (Chromium, Firefox, WebKit, Pixel 7, iPhone 14)
    needs: backend-tests
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: ecommerce, POSTGRES_USER: ecommerce, POSTGRES_PASSWORD: ecommerce }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ecommerce" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build and start backend
        run: |
          mvn -B -q -f backend/pom.xml -DskipTests package
          nohup java -jar backend/target/rbctcsworld-shop-backend-1.0.0.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8081/actuator/health >/dev/null && break; sleep 2; done
          curl -sf http://localhost:8081/actuator/health
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: npm, cache-dependency-path: playwright/package-lock.json }
      - name: Build and serve frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npx vite preview --port 5173 --strictPort > ../frontend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5173 > /dev/null && break; sleep 1; done
      - name: Install Playwright and its three browser engines
        working-directory: playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
          npx tsc --noEmit
      - name: Playwright tests (one retry; a pass on retry is reported as flaky)
        working-directory: playwright
        run: npx playwright test
      - name: Test totals
        if: always()
        working-directory: playwright
        run: |
          [ -f junit.xml ] || exit 0
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          r = ET.parse('junit.xml').getroot()
          t, f, e, s = (int(r.get(k, 0)) for k in ('tests', 'failures', 'errors', 'skipped'))
          print(f"::notice title=Test totals playwright::{t} tests | failures {f} | errors {e} | skipped {s}")
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: playwright/playwright-report

  mobile-android:
    name: Appium - Chrome on an Android emulator
    needs: backend-tests
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: ecommerce, POSTGRES_USER: ecommerce, POSTGRES_PASSWORD: ecommerce }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ecommerce" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build and start backend
        run: |
          mvn -B -q -f backend/pom.xml -DskipTests package
          nohup java -jar backend/target/rbctcsworld-shop-backend-1.0.0.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8081/actuator/health >/dev/null && break; sleep 2; done
          curl -sf http://localhost:8081/actuator/health
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build and serve frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          # IPv4 on purpose: "localhost" is ::1 for Node 22, but the Android emulator reaches the machine
          # as 10.0.2.2 -> 127.0.0.1 (connection refused otherwise)
          nohup npx vite preview --host 127.0.0.1 --port 5173 --strictPort > ../frontend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5173 > /dev/null && break; sleep 1; done
      - name: Compile the automation suite (outside the emulator/simulator time)
        run: mvn -B -q -f automation/pom.xml test-compile
      - name: Appium 3 with the UiAutomator2 driver
        run: |
          npm install -g appium@3.8.0
          appium driver install uiautomator2@8.7.0
          echo "::notice title=Appium::$(appium --version), $(appium driver list --installed 2>&1 | grep -o 'uiautomator2@[0-9.]*')"
      - name: Hardware acceleration for the emulator (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Phone tests in Chrome on Android 14 (Pixel 6 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M                  # Chrome lost its DevTools connection once with the default 2 GB
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: .github/scripts/android-mobile-tests.sh
      - name: Test totals
        if: always()
        run: LIST_TESTS=1 .github/scripts/test-totals.sh "mobile-android" automation/target/surefire-reports
      - name: Show failed tests as annotations
        if: failure()
        run: |
          .github/scripts/annotate-failures.sh automation/target/surefire-reports
          tail -60 appium.log || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mobile-android-results
          path: |
            automation/target/surefire-reports
            automation/target/allure-results
            appium.log
            backend.log

  mobile-ios:
    name: Appium - Safari on an iOS Simulator
    needs: backend-tests
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: PostgreSQL 16 (no Docker on macOS runners)
        run: |
          brew install postgresql@16 >/dev/null
          brew services start postgresql@16
          export PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          for i in $(seq 1 30); do pg_isready -q && break; sleep 1; done
          psql -d postgres -c "CREATE ROLE ecommerce LOGIN PASSWORD 'ecommerce';" -c "CREATE DATABASE ecommerce OWNER ecommerce;"
      - name: Build and start backend
        run: |
          mvn -B -q -f backend/pom.xml -DskipTests package
          nohup java -jar backend/target/rbctcsworld-shop-backend-1.0.0.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8081/actuator/health >/dev/null && break; sleep 2; done
          curl -sf http://localhost:8081/actuator/health
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build and serve frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          # IPv4 on purpose: "localhost" is ::1 for Node 22, but the Android emulator reaches the machine
          # as 10.0.2.2 -> 127.0.0.1 (connection refused otherwise)
          nohup npx vite preview --host 127.0.0.1 --port 5173 --strictPort > ../frontend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5173 > /dev/null && break; sleep 1; done
      - name: Compile the automation suite (outside the emulator/simulator time)
        run: mvn -B -q -f automation/pom.xml test-compile
      - name: Appium 3 with the XCUITest driver
        run: |
          npm install -g appium@3.8.0
          appium driver install xcuitest@12.13.3
          echo "::notice title=Appium::$(appium --version), Xcode $(xcodebuild -version | head -1)"
      - name: Boot the newest iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          phones = [(runtime, d) for runtime, ds in devices.items() if '.iOS-' in runtime for d in ds if d['name'].startswith('iPhone')]
          phones.sort(key=lambda p: [int(x) for x in p[0].split('.iOS-')[1].split('-')])
          runtime, d = phones[-1]
          print(d['udid']); print(d['name'], runtime, file=sys.stderr)")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "UDID=$udid" >> "$GITHUB_ENV"
      - name: Start Appium
        run: |
          nohup appium --address 127.0.0.1 --port 4723 --log appium.log --log-level info --log-no-colors > /dev/null 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4723/status >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:4723/status
      - name: Phone tests in Safari on iOS (the first session builds WebDriverAgent)
        run: >-
          mvn -B -f automation/pom.xml test -Dgroups=mobile -DexcludedGroups=none -Dbrowser=ios-safari
          -DbaseUrl=http://localhost:8081 -DuiUrl=http://localhost:5173 -DappiumUrl=http://127.0.0.1:4723
          -DdeviceId=${{ env.UDID }} -Dsurefire.rerunFailingTestsCount=1
      - name: Test totals
        if: always()
        run: LIST_TESTS=1 .github/scripts/test-totals.sh "mobile-ios" automation/target/surefire-reports
      - name: Show failed tests as annotations
        if: failure()
        run: |
          .github/scripts/annotate-failures.sh automation/target/surefire-reports
          tail -60 appium.log || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mobile-ios-results
          path: |
            automation/target/surefire-reports
            automation/target/allure-results
            appium.log
            backend.log

  api-automation:
    name: API + DB + BDD + Selenium UI tests (PostgreSQL)
    needs: backend-tests
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: ecommerce, POSTGRES_USER: ecommerce, POSTGRES_PASSWORD: ecommerce }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ecommerce" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31.5
        ports: ['1025:1025', '8025:8025']
    env:
      LOGIN_STORE: redis                       # lockout counters in Redis, shared by both backends below
      NOTIFICATIONS_CHANNEL: smtp              # order e-mails go to Mailpit; both backends share one outbox
      MAIL_HOST: localhost
      MAIL_PORT: '1025'
      NOTIFICATIONS_POLL_MS: '500'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build and start two backends (8081 + 8082) sharing PostgreSQL and Redis
        run: |
          mvn -B -f backend/pom.xml -DskipTests package
          nohup java -jar backend/target/rbctcsworld-shop-backend-1.0.0.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8081/actuator/health && break; sleep 2; done
          curl -sf http://localhost:8081/actuator/health
          # second instance: proves the lockout is shared (SharedLockoutTest), like a load-balanced deployment
          SERVER_PORT=8082 nohup java -Xmx384m -jar backend/target/rbctcsworld-shop-backend-1.0.0.jar > backend-2.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8082/actuator/health && break; sleep 2; done
          curl -sf http://localhost:8082/actuator/health
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build and serve frontend (vite preview on 5173, /api proxied to 8081)
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npx vite preview --port 5173 --strictPort > ../frontend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5173 > /dev/null && break; sleep 1; done
          curl -sf http://localhost:5173/api/products > /dev/null && echo "frontend + proxy OK"
      - name: Run API + DB + BDD + UI tests (headless Chrome, preinstalled on the runner)
        run: >-
          mvn -B -f automation/pom.xml test
          -DbaseUrl=http://localhost:8081 -DsecondBaseUrl=http://localhost:8082 -DuiUrl=http://localhost:5173 -Dheadless=true
          -DmailpitUrl=http://localhost:8025

      # ---------- k6 performance smoke + flash-sale invariant ----------
      - uses: grafana/setup-k6-action@v1
        if: always()
      - name: k6 smoke (SLO thresholds) and flash-sale (no overselling)
        if: always()
        run: |
          k6 run -q -e DURATION=30s performance/tests/smoke.js
          k6 run -q -e BUYERS=60 -e STOCK=15 performance/tests/flash-sale.js
          # catalog size/latency after the whole suite has filled the catalog (DEF-007 regression)
          k6 run -q -e DURATION=20s performance/tests/catalog.js
      - name: k6 key numbers as annotations
        if: always()
        run: for t in smoke flash-sale catalog; do performance/summary-notice.sh $t; done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: k6-reports
          path: performance/reports/

      - name: Test totals
        if: always()
        run: .github/scripts/test-totals.sh automation automation/target/surefire-reports
      - name: Backend server errors (500) as annotations
        if: always()
        run: .github/scripts/backend-errors.sh backend.log
      - name: Show failed tests as annotations
        if: failure()
        run: .github/scripts/annotate-failures.sh automation/target/surefire-reports

      # ---------- Allure report ----------
      - name: Restore Allure history from the published report (trend graphs)
        if: always()
        run: |
          H=automation/target/allure-results/history
          mkdir -p $H
          BASE=https://rbchy.github.io/RbcTcsWorld/history
          for f in history.json history-trend.json duration-trend.json retry-trend.json categories-trend.json; do
            curl -sf "$BASE/$f" -o "$H/$f" || true
          done
      - name: Generate Allure report
        if: always()
        run: mvn -B -f automation/pom.xml allure:report
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: allure-report
          path: automation/target/allure-report
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cucumber-report
          path: automation/target/cucumber-report.html
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: automation-reports
          path: |
            automation/target/surefire-reports
            automation/target/cucumber-report.html
            backend.log
            backend-2.log
            frontend.log

  jenkinsfile-lint:
    name: Jenkinsfile lint (real Jenkins, declarative validator)
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: .github/scripts/lint-jenkinsfile.sh

  docker-e2e:
    name: Whole app in Docker (compose) + smoke tests
    needs: backend-tests
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: docker compose --profile app up (build images, wait until every container is healthy)
        run: |
          docker compose --profile app up -d --build --wait --wait-timeout 300
          docker compose --profile app ps
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep rbctcsworld \
            | sed 's/^/::notice title=Docker image::/'
      - name: Containers answer through the storefront's nginx
        run: |
          set -e
          curl -fsS http://localhost:5173/healthz
          curl -fsS http://localhost:5173/ | grep -q '<div id="root">'
          # API through the nginx reverse proxy (same origin as the browser uses)
          curl -fsS "http://localhost:5173/api/products?size=1" -D - -o /dev/null | grep -i '^x-total-count'
          # storefront security headers; no nginx version leaked
          h=$(curl -fsSI http://localhost:5173/)
          echo "$h" | grep -qi '^x-frame-options: DENY'
          echo "$h" | grep -qi '^content-security-policy:'
          ! echo "$h" | grep -qiE '^server: nginx/[0-9]'
          # backend container does not run as root
          test "$(docker compose exec -T backend id -u)" != "0"
          echo "::notice title=Docker::storefront, API proxy, security headers and non-root user verified"
      - name: Smoke tests (API, BDD, UI) against the containers
        run: >-
          mvn -B -f automation/pom.xml test -Dgroups=smoke
          -DbaseUrl=http://localhost:8081 -DuiUrl=http://localhost:5173 -Dheadless=true
      - name: Test totals
        if: always()
        run: .github/scripts/test-totals.sh docker-smoke automation/target/surefire-reports
      - name: Failed tests and container logs
        if: failure()
        run: |
          .github/scripts/annotate-failures.sh automation/target/surefire-reports
          docker compose --profile app logs --no-color --tail=80
      - name: Stop and remove containers and the database volume
        if: always()
        run: docker compose --profile app down -v

  demo-stack:
    name: Public demo stack (HTTPS, demo safeguards, nightly reset)
    needs: backend-tests
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 35
    env:
      DC: docker compose -f deploy/docker-compose.yml --env-file deploy/.env
    steps:
      - uses: actions/checkout@v5
      - name: Start the demo exactly as on the server (deploy/docker-compose.yml, Caddy on 80 + 443)
        run: |
          # same file the server gets from setup-vm.sh; "localhost" makes Caddy use its own local CA
          cat > deploy/.env <<ENV
          DEMO_DOMAIN=localhost
          DB_PASSWORD=$(openssl rand -hex 16)
          JWT_SECRET=$(openssl rand -hex 32)
          ADMIN_EMAIL=admin@rbctcsworld.com
          ADMIN_PASSWORD=Ci-Demo-$(openssl rand -hex 6)!
          ENV
          $DC up -d --build --wait --wait-timeout 600
          $DC ps
      - name: Only Caddy is reachable; the backend refuses development secrets
        run: |
          set -e
          for port in 5432 6379 8081 5173 1025; do
            ! nc -z -w 2 127.0.0.1 "$port" || { echo "::error::port $port is published"; exit 1; }
          done
          docker port rbctcsworld-demo-mailpit-1 8025 | grep -q '^127.0.0.1:' # inbox only through an SSH tunnel
          # a forgotten secret must stop the start, not go live (real database, only JWT_SECRET missing)
          . deploy/.env
          out=$(timeout 180 docker run --rm --network rbctcsworld-demo_default -e DEMO_MODE=true -e DB_HOST=postgres \
                -e DB_PASSWORD="$DB_PASSWORD" -e ADMIN_PASSWORD=Strong-Pass-1 rbctcsworld/backend:demo 2>&1 || true)
          echo "$out" | grep -q "public development JWT secret" || { echo "$out" | tail -20; exit 1; }
          echo "::notice title=Demo::only 80/443 open; development JWT secret refused"
      - name: Smoke test from the outside (deploy/smoke.sh)
        run: CURL_OPTS=-k deploy/smoke.sh https://localhost
      - name: Demo rules through the API, then the nightly reset
        run: |
          set -e
          . deploy/.env
          api() { curl -sk -H 'Content-Type: application/json' "$@"; }
          token=$(api -X POST https://localhost/api/auth/login \
                  -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}" | jq -r .token)
          test "$token" != null
          code=$(api -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" -X POST https://localhost/api/products \
                 -d '{"name":"Outside pic","sku":"CI-PIC-1","price":1,"stock":1,"imageUrl":"https://example.com/a.png"}')
          test "$code" = 400 || { echo "::error::outside picture link accepted ($code)"; exit 1; }
          # a visitor registers ...
          api -X POST https://localhost/api/auth/register -d '{"email":"visitor@ci.test","password":"Visitor-Pass-1"}' \
            -o /dev/null -w '%{http_code}\n' | grep -q 201
          # ... and is gone after the nightly reset, while the shop is complete again
          deploy/reset-demo.sh
          code=$(api -o /dev/null -w '%{http_code}' -X POST https://localhost/api/auth/login \
                 -d '{"email":"visitor@ci.test","password":"Visitor-Pass-1"}')
          test "$code" = 401 || { echo "::error::visitor survived the reset ($code)"; exit 1; }
          CURL_OPTS=-k deploy/smoke.sh https://localhost
          echo "::notice title=Demo::outside pictures refused; nightly reset removes visitors and restores the shop"
      - name: Container logs
        if: failure()
        run: |
          # which container failed, as annotations (the full logs are in the job output)
          $DC ps -a --format '{{.Service}} {{.Status}}' | grep -viE 'healthy|Up [0-9]+ (second|minute)s?$' \
            | sed 's/^/::error title=Demo container::/' || true
          for s in backend frontend caddy; do
            $DC logs --no-color --tail=5 "$s" 2>&1 | tail -3 | sed "s/^/::warning title=$s log::/" || true
          done
          $DC logs --no-color --tail=80
      - name: Stop and remove the demo
        if: always()
        run: $DC down -v

  production-stack:
    name: Production stack (live settings, encrypted off-site backups, restore drill, health alerts)
    needs: backend-tests
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 45
    env:
      DC: docker compose -f deploy/production/docker-compose.yml --env-file deploy/production/.env
      S3: docker run --rm --network host -e AWS_ACCESS_KEY_ID=ci-backup -e AWS_SECRET_ACCESS_KEY=ci-backup-secret -e AWS_DEFAULT_REGION=us-east-1 amazon/aws-cli:2.31.3 --endpoint-url http://127.0.0.1:9000 s3
    steps:
      - uses: actions/checkout@v5
      - name: Off-site bucket (MinIO, S3-compatible) and a receiver for the alerts
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 -e MINIO_ROOT_USER=ci-backup -e MINIO_ROOT_PASSWORD=ci-backup-secret \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          $S3 mb s3://rbctcsworld-backups
          mkdir -p "$RUNNER_TEMP/backups"
          nohup python3 .github/scripts/alert-receiver.py "$RUNNER_TEMP/alerts.txt" > /dev/null 2>&1 &
          touch "$RUNNER_TEMP/alerts.txt"
      - name: Start the live store exactly as on the server (prod profile, demo off)
        run: |
          cat > deploy/production/.env <<ENV
          STORE_DOMAIN=localhost
          DB_PASSWORD=$(openssl rand -hex 16)
          JWT_SECRET=$(openssl rand -hex 32)
          ADMIN_EMAIL=owner@ci.test
          ADMIN_PASSWORD=Ci-Prod-$(openssl rand -hex 6)!
          PAYMENT_PROVIDER=mock
          NOTIFICATIONS_CHANNEL=log
          BACKUP_PASSPHRASE=$(openssl rand -hex 32)
          BACKUP_DIR=$RUNNER_TEMP/backups
          BACKUP_S3_BUCKET=rbctcsworld-backups
          BACKUP_S3_ENDPOINT=http://127.0.0.1:9000
          BACKUP_S3_ACCESS_KEY=ci-backup
          BACKUP_S3_SECRET_KEY=ci-backup-secret
          ALERT_WEBHOOK_URL=http://127.0.0.1:8099/hook
          CERT_MIN_DAYS=0
          ENV
          $DC up -d --build --wait --wait-timeout 900
          $DC ps
      - name: Only Caddy is reachable; not the demo build; a missing setting stops the start
        run: |
          set -e
          for port in 5432 6379 8081 5173 8025; do
            ! nc -z -w 2 127.0.0.1 "$port" || { echo "::error::port $port is published"; exit 1; }
          done
          CURL_OPTS=-k deploy/smoke.sh --production https://localhost
          out=$(env -u PAYMENT_PROVIDER docker compose -f deploy/production/docker-compose.yml \
                --env-file <(grep -v '^PAYMENT_PROVIDER=' deploy/production/.env) config 2>&1 || true)
          echo "$out" | grep -q "set PAYMENT_PROVIDER" || { echo "$out" | tail -5; exit 1; }
          echo "::notice title=Production::only 80/443 open, no demo ribbon, a missing setting stops the start"
      - name: A customer orders; the backup is encrypted, checked and copied off the server
        run: |
          set -e
          . deploy/production/.env
          api() { curl -sk -H 'Content-Type: application/json' "$@"; }
          admin=$(api -X POST https://localhost/api/auth/login -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}" | jq -r .token)
          customer=$(api -X POST https://localhost/api/auth/register -d '{"email":"buyer@ci.test","password":"Buyer-Pass-1"}' | jq -r .token)
          product=$(api -X POST https://localhost/api/products -H "Authorization: Bearer $admin" \
                    -d '{"name":"Backup proof","sku":"CI-BKP-1","price":10,"stock":5}' | jq -r .id)
          api -X POST https://localhost/api/cart/items -H "Authorization: Bearer $customer" -d "{\"productId\":$product,\"quantity\":1}" > /dev/null
          order=$(api -X POST https://localhost/api/orders -H "Authorization: Bearer $customer" -d '{"shippingAddress":{"fullName":"Ada Lovelace","line1":"12 Main St","city":"Pittsburgh","state":"PA","zip":"15213"}}' | jq -r .id)
          test "$order" != null
          deploy/production/backup.sh
          file=$(jq -r .file "$BACKUP_DIR/latest.json")
          head -c 8 "$BACKUP_DIR/$file" | grep -q Salted__ || { echo "::error::backup is not encrypted"; exit 1; }
          ! grep -q PGDMP "$BACKUP_DIR/$file" || { echo "::error::plain dump inside"; exit 1; }
          jq -e '.rows.users >= 2 and .rows.orders >= 1' "$BACKUP_DIR/latest.json"
          $S3 ls s3://rbctcsworld-backups/rbctcsworld/ | tee /dev/stderr | grep -q "$file"
          echo "::notice title=Backup::$file encrypted, manifest $(jq -c .rows "$BACKUP_DIR/latest.json"), copied to the bucket"
      - name: Restore drill - a damaged backup is caught, the off-site copy restores
        run: |
          set -e
          . deploy/production/.env
          file=$(jq -r .file "$BACKUP_DIR/latest.json")
          printf 'X' | dd of="$BACKUP_DIR/$file" bs=1 seek=100 conv=notrunc 2>/dev/null       # one byte damaged
          ! deploy/production/restore-drill.sh || { echo "::error::damaged backup passed the drill"; exit 1; }
          grep -q "Restore drill FAILED" "$RUNNER_TEMP/alerts.txt" || { echo "::error::no alert for the failed drill"; exit 1; }
          deploy/production/restore-drill.sh --from-offsite          # as after losing the server: from the bucket
          echo "::notice title=Restore drill::damaged file refused with an alert; off-site copy restored and checked"
      - name: Restore puts the backup back into the live store
        run: |
          set -e
          . deploy/production/.env
          api() { curl -sk -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' "$@"; }
          test "$(api -X POST https://localhost/api/auth/register -d '{"email":"later@ci.test","password":"Later-Pass-1"}')" = 201
          CURL_OPTS=-k deploy/production/restore.sh "$(jq -r .file "$BACKUP_DIR/latest.json")" --yes
          test "$(api -X POST https://localhost/api/auth/login -d '{"email":"later@ci.test","password":"Later-Pass-1"}')" = 401
          test "$(api -X POST https://localhost/api/auth/login -d '{"email":"buyer@ci.test","password":"Buyer-Pass-1"}')" = 200
          echo "::notice title=Restore::the store is back at the backup: later account gone, the customer is there"
      - name: Health check - quiet while fine, one alert per change, recovery reported
        run: |
          set -e
          : > "$RUNNER_TEMP/alerts.txt"
          CURL_OPTS=-k deploy/production/healthcheck.sh
          test ! -s "$RUNNER_TEMP/alerts.txt"
          $DC stop frontend
          ! CURL_OPTS=-k deploy/production/healthcheck.sh
          ! CURL_OPTS=-k deploy/production/healthcheck.sh                   # still down: no second alert
          test "$(grep -c 'Problem:' "$RUNNER_TEMP/alerts.txt")" = 1
          grep -q 'container frontend is' "$RUNNER_TEMP/alerts.txt"
          $DC up -d --wait frontend
          CURL_OPTS=-k deploy/production/healthcheck.sh
          grep -q 'Recovered' "$RUNNER_TEMP/alerts.txt"
          echo "::notice title=Health check::$(cat "$RUNNER_TEMP/alerts.txt" | tr '\n' ' ')"
      - name: Container logs
        if: failure()
        run: |
          $DC ps -a
          $DC logs --no-color --tail=80
          cat "$RUNNER_TEMP/alerts.txt" 2>/dev/null || true
      - name: Stop and remove the stack
        if: always()
        run: |
          $DC down -v || true
          docker rm -f minio rbctcsworld-drill || true

  security-scan:
    name: Security scan (OWASP ZAP API scan + OSV dependency scan)
    needs: backend-tests
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 40
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: ecommerce, POSTGRES_USER: ecommerce, POSTGRES_PASSWORD: ecommerce }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ecommerce" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }

      # ---------- dependencies with known vulnerabilities (SCA) ----------
      # Maven-resolved CycloneDX SBOMs scanned by OSV-Scanner, with a completeness check and a self-test
      # (DEF-021: OSV's own Maven resolution fell back to direct dependencies on HTTP 429 and missed findings).
      - name: SBOM + OSV-Scanner - known vulnerabilities in dependencies
        run: security/osv-scan.sh
      - name: Dependency findings as annotations
        if: always()
        run: security/osv-summary.sh osv-results.json
      - name: Newest patch versions on Maven Central
        if: always()
        run: security/latest-versions.sh

      # ---------- running application (DAST) ----------
      - name: Build and start backend
        run: |
          mvn -B -f backend/pom.xml -DskipTests package
          nohup java -jar backend/target/rbctcsworld-shop-backend-1.0.0.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8081/actuator/health && break; sleep 2; done
          curl -sf http://localhost:8081/v3/api-docs -o security/zap/openapi.json
          jq '.paths | keys | length' security/zap/openapi.json
      - name: API contract - no breaking change against the approved OpenAPI baseline
        run: .github/scripts/openapi-breaking-changes.sh docs/api/openapi.json security/zap/openapi.json
      - name: OWASP ZAP API scan (logged in as a customer)
        run: |
          TOKEN=$(curl -sf -X POST http://localhost:8081/api/auth/register -H 'Content-Type: application/json' \
            -d '{"email":"zap-scanner@security.test","password":"Password1!"}' | jq -r .token)
          chmod -R 777 security/zap
          set +e
          # ZAP adds this header to every request it sends (built-in env variables of the packaged scans)
          docker run --rm --network host -v "$PWD/security/zap:/zap/wrk:rw" \
            -e ZAP_AUTH_HEADER=Authorization -e ZAP_AUTH_HEADER_VALUE="Bearer $TOKEN" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t http://localhost:8081/v3/api-docs -f openapi -c zap-rules.tsv -I \
              -r zap-report.html -J zap-report.json
          code=$?
          set -e
          security/zap/summary.sh security/zap/zap-report.json
          # 0 = clean, 2 = warnings only (allowed by -I); 1 = a FAIL rule was hit; 3 = ZAP error
          if [ "$code" -eq 1 ] || [ "$code" -eq 3 ]; then echo "::error title=OWASP ZAP::exit code $code"; exit 1; fi
      - name: Backend server errors (500) as annotations
        if: always()
        run: .github/scripts/backend-errors.sh backend.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: zap-report
          path: |
            security/zap/zap-report.html
            security/zap/zap-report.json
            osv-results.json
            backend.log

  publish-report:
    name: Publish Allure report to GitHub Pages
    needs: [api-automation, mutation-tests, playwright]
    # not from a runner-canary run (inputs.runner set): the published report always comes from the pinned image
    if: always() && needs.api-automation.result != 'skipped' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.runner == ''
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    # Pages must be enabled once (Settings > Pages > Source: GitHub Actions); until then this job
    # fails without turning the whole CI run red.
    continue-on-error: true
    concurrency: { group: github-pages, cancel-in-progress: false }   # one deployment at a time
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # one site: Allure (/), Cucumber (/cucumber/), JaCoCo coverage (/coverage/), PIT mutation report (/mutation/),
      # Playwright (/playwright/) and an index of all of them (/reports/)
      - uses: actions/checkout@v5
        with: { sparse-checkout: .github/pages, path: src }
      - uses: actions/download-artifact@v7
        with: { name: allure-report, path: site }
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with: { name: backend-coverage, path: site/coverage }
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with: { name: mutation-report, path: site/mutation }
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with: { name: playwright-report, path: site/playwright }
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with: { name: cucumber-report, path: site/cucumber }
      - name: Cucumber page and the reports index
        run: |
          [ -f site/cucumber/cucumber-report.html ] && mv site/cucumber/cucumber-report.html site/cucumber/index.html || true
          mkdir -p site/reports && cp src/.github/pages/reports.html site/reports/index.html
      - uses: actions/upload-pages-artifact@v5
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v5
