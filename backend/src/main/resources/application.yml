spring:
  application:
    name: rbctcsworld-shop
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce}
    username: ${DB_USER:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks entities match it
    open-in-view: false
  flyway:
    enabled: true
    # common migrations + the database-specific ones ({vendor} = postgresql | h2), e.g. the audit trigger
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
  # Spring Boot 4 uses Jackson 3. Keep the Jackson 2 defaults so the JSON contract of the API does not change
  # (e.g. property order, null handling for primitives); the automation suite checks that contract.
  jackson:
    use-jackson2-defaults: true

# 8081 (not 8080) because Jenkins usually runs on 8080 on the same machine.
# Automation, frontend proxy and README all use 8081.
server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  public-url: ${PUBLIC_URL:http://localhost:5173}   # storefront address, used in e-mailed links (password reset)
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-which-must-be-long-enough-123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}   # access token: 15 minutes, renewed with the refresh token
    refresh-days: ${REFRESH_DAYS:14}              # refresh token: 14 days, rotated on every use
    refresh-grace-seconds: ${REFRESH_GRACE_SECONDS:30}   # a spent token works once more within 30 s (lost response)
  seed:
    # DEV ONLY - override with environment variables in any shared environment
    admin-email: ${ADMIN_EMAIL:admin@rbctcsworld.com}
    admin-password: ${ADMIN_PASSWORD:Admin@12345}
  pricing:
    tax-rate: 0.06                    # 6% sales tax on merchandise (not on shipping)
    free-shipping-threshold: 50.00    # merchandise total after discount
    shipping-fee: 5.99
  tax:
    provider: ${TAX_PROVIDER:flat}    # flat = tax-rate above | stripe = Stripe Tax (uses STRIPE_SECRET_KEY)
  shipping:
    provider: ${SHIPPING_PROVIDER:simulated}   # simulated (made-up tracking numbers) | shippo (real labels)
    shippo:
      api-base: ${SHIPPO_API_BASE:https://api.goshippo.com}
      token: ${SHIPPO_TOKEN:}                  # shippo_test_... (test labels are free); shippo_live_ only with 'prod'
      webhook-token: ${SHIPPO_WEBHOOK_TOKEN:}  # secret in the track_updated webhook URL: ...?token=<this>
      timeout-seconds: 20
    from:                                      # the return address on every label - PLACEHOLDER until the store has one
      name: ${SHIP_FROM_NAME:RbcTcsWorld Shop}
      street: ${SHIP_FROM_STREET:965 Mission St}
      city: ${SHIP_FROM_CITY:San Francisco}
      state: ${SHIP_FROM_STATE:CA}
      zip: ${SHIP_FROM_ZIP:94103}
      phone: ${SHIP_FROM_PHONE:4155550100}
    parcel:                                    # one box per order until products carry their own weight and size
      length-in: 10
      width-in: 8
      height-in: 4
      ounces-per-item: 16
  payment:
    provider: ${PAYMENT_PROVIDER:mock}            # mock (test cards, default) | stripe
    stripe:
      api-base: ${STRIPE_API_BASE:https://api.stripe.com}   # stripe-mock: http://localhost:12111
      publishable-key: ${STRIPE_PUBLISHABLE_KEY:}   # pk_test_... turns on Stripe Elements (the card goes to Stripe, never here)
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}     # whsec_... checks that payment results really come from Stripe
      secret-key: ${STRIPE_SECRET_KEY:}           # sk_test_... ; a live key is refused outside 'prod'
      currency: usd
      timeout-seconds: 10
  notifications:
    channel: ${NOTIFICATIONS_CHANNEL:log}         # log (development) | smtp (Mailpit) | ses (Amazon SES)
    smtp:
      host: ${MAIL_HOST:localhost}
      port: ${MAIL_PORT:1025}                     # Mailpit
    # the sender: the store's own domain, verified in SES with DKIM - PLACEHOLDER until the store has a domain
    from: ${MAIL_FROM:RbcTcsWorld <orders@rbctcsworld.test>}
    ses:
      region: ${SES_REGION:}                      # e.g. us-east-1
      access-key-id: ${AWS_ACCESS_KEY_ID:}        # an IAM user that may only ses:SendEmail
      secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
      session-token: ${AWS_SESSION_TOKEN:}        # only with temporary keys
      configuration-set: ${SES_CONFIGURATION_SET:}   # sends bounces and complaints to the SNS topic below
      sns-topic-arn: ${SES_SNS_TOPIC_ARN:}        # the only topic POST /api/notifications/ses/events accepts
      endpoint: ${SES_ENDPOINT:}                  # tests only; default https://email.<region>.amazonaws.com
    poll-ms: ${NOTIFICATIONS_POLL_MS:2000}        # how often the outbox is checked
  returns:
    window-days: 30                   # a return may be requested up to 30 days after delivery
  store:                              # who runs the store: shown on the privacy policy, terms and return policy
    name: RbcTcsWorld Shop
    legal-name: ${STORE_LEGAL_NAME:}               # e.g. "RbcTcsWorld LLC" once registered (empty: placeholder)
    street: ${STORE_STREET:}
    city: ${STORE_CITY:}
    state: ${STORE_STATE:}
    zip: ${STORE_ZIP:}
    contact-email: ${STORE_CONTACT_EMAIL:}
    policies-effective: ${STORE_POLICIES_EFFECTIVE:2026-10-28}
    policies-reviewed: ${STORE_POLICIES_REVIEWED:false}   # true only after a lawyer has read the policies
    governing-law: Pennsylvania
  security:
    login:
      max-failures: 5        # failed logins per e-mail ...
      window-minutes: 15     # ... within this time ...
      lock-minutes: 15       # ... lock that e-mail for this long (HTTP 429 + Retry-After)
      store: ${LOGIN_STORE:memory}               # memory (one backend) | redis (shared by all backends)
      redis-url: ${REDIS_URL:redis://localhost:6379}

  demo:
    # Public demo (deploy/): refuses the development JWT secret and admin password, and accepts only the
    # shop's own product pictures. The storefront shows a "demo" ribbon (built with VITE_DEMO=true).
    enabled: ${DEMO_MODE:false}

# OpenAPI JSON for tools (OWASP ZAP). Switch off in production with API_DOCS_ENABLED=false.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
