spring:
  application:
    name: rbctcsworld-ecommerce
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce}
    username: ${DB_USER:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks entities match it
    open-in-view: false
  flyway:
    enabled: true
  # Spring Boot 4 uses Jackson 3. Keep the Jackson 2 defaults so the JSON contract of the API does not change
  # (e.g. property order, null handling for primitives); the automation suite checks that contract.
  jackson:
    use-jackson2-defaults: true

# 8081 (not 8080) because Jenkins usually runs on 8080 on the same machine.
# Automation, frontend proxy and README all use 8081.
server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-which-must-be-long-enough-123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}   # access token: 15 minutes, renewed with the refresh token
    refresh-days: ${REFRESH_DAYS:14}              # refresh token: 14 days, rotated on every use
    refresh-grace-seconds: ${REFRESH_GRACE_SECONDS:30}   # a spent token works once more within 30 s (lost response)
  seed:
    # DEV ONLY - override with environment variables in any shared environment
    admin-email: ${ADMIN_EMAIL:admin@rbctcsworld.com}
    admin-password: ${ADMIN_PASSWORD:Admin@12345}
  pricing:
    tax-rate: 0.06                    # 6% sales tax on merchandise (not on shipping)
    free-shipping-threshold: 50.00    # merchandise total after discount
    shipping-fee: 5.99
  payment:
    provider: ${PAYMENT_PROVIDER:mock}            # mock (test cards, default) | stripe
    stripe:
      api-base: ${STRIPE_API_BASE:https://api.stripe.com}   # stripe-mock: http://localhost:12111
      secret-key: ${STRIPE_SECRET_KEY:}           # sk_test_... ; a live key is refused outside 'prod'
      currency: usd
      timeout-seconds: 10
  notifications:
    channel: ${NOTIFICATIONS_CHANNEL:log}         # log (development) | smtp
    smtp:
      host: ${MAIL_HOST:localhost}
      port: ${MAIL_PORT:1025}                     # Mailpit; a real provider uses 587 + credentials
    from: "RbcTcsWorld <orders@rbctcsworld.test>"
    poll-ms: ${NOTIFICATIONS_POLL_MS:2000}        # how often the outbox is checked
  returns:
    window-days: 30                   # a return may be requested up to 30 days after delivery
  security:
    login:
      max-failures: 5        # failed logins per e-mail ...
      window-minutes: 15     # ... within this time ...
      lock-minutes: 15       # ... lock that e-mail for this long (HTTP 429 + Retry-After)
      store: ${LOGIN_STORE:memory}               # memory (one backend) | redis (shared by all backends)
      redis-url: ${REDIS_URL:redis://localhost:6379}

  demo:
    # Public demo (deploy/): refuses the development JWT secret and admin password, and accepts only the
    # shop's own product pictures. The storefront shows a "demo" ribbon (built with VITE_DEMO=true).
    enabled: ${DEMO_MODE:false}

# OpenAPI JSON for tools (OWASP ZAP). Switch off in production with API_DOCS_ENABLED=false.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
