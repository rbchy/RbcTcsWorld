# Used by @ActiveProfiles("test"): H2 in PostgreSQL mode, same Flyway migrations as production.
spring:
  datasource:
    url: jdbc:h2:mem:ecommerce;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
    driver-class-name: org.h2.Driver

# integration tests call NotificationDeliveryService.sendDue() themselves; the scheduler stays quiet
app:
  notifications:
    poll-ms: 3600000
