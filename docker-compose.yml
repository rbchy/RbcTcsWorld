# Two ways to use this file:
#
#   docker compose up -d                          -> PostgreSQL + Redis + Mailpit (daily development: run the backend
#                                                    from Eclipse / "mvn spring-boot:run" and "npm run dev")
#   docker compose --profile app up -d --build    -> the WHOLE application in containers:
#                                                    PostgreSQL + Redis + Mailpit + backend (8081) + storefront (http://localhost:5173)
#   E-mails the shop sends: http://localhost:8025 (Mailpit inbox; nothing leaves your computer)
#   docker compose --profile app down             -> stop it (add -v to also delete the database volume)
#
# The backend waits until PostgreSQL and Redis are healthy, the storefront until the backend is healthy.
name: rbctcsworld

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Login lockout counters, shared by every backend instance (LOGIN_STORE=redis). Short-lived keys that
  # expire by themselves, so no persistence: a Redis restart only forgets locks of at most 15 minutes.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-ttl"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m

  # Test mail server: catches every e-mail (SMTP 1025) and shows it in a web inbox on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31.5
    ports: ["8025:8025", "1025:1025"]
    mem_limit: 128m

  backend:
    profiles: ["app"]
    build: ./backend
    image: rbctcsworld/backend:local
    environment:
      DB_HOST: postgres
      # development values - override them in any shared environment (see SECURITY_BN.md)
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-key-which-must-be-long-enough-123456789}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@rbctcsworld.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      LOGIN_STORE: ${LOGIN_STORE:-redis}
      REDIS_URL: redis://redis:6379
      NOTIFICATIONS_CHANNEL: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      # payments: mock unless set; Stripe test keys turn on Stripe Elements (docs/modules/STRIPE_ELEMENTS_BN.md)
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports: ["8081:8081"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    mem_limit: 768m

  frontend:
    profiles: ["app"]
    build: ./frontend
    image: rbctcsworld/frontend:local
    ports: ["5173:80"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata: {}
