# Serves the built React app and forwards /api to the backend container.
# Browser -> one origin (this nginx) -> no CORS needed, same as the Vite proxy in development.
server {
    listen 80;
    server_tokens off;                       # no nginx version in headers or error pages

    root /usr/share/nginx/html;
    index index.html;

    # Security headers are set per location below. Not at server level on purpose: /api responses
    # already carry the backend's own (stricter) headers and must not get a second copy.

    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # hashed assets can be cached for a year; index.html must always be fresh
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        # Stripe Elements: Stripe.js and its card frames come from Stripe (https://docs.stripe.com/security/guide#content-security-policy)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; connect-src 'self' https://api.stripe.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
    }
}
